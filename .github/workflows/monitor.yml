name: Monitor concerts

on:
  schedule:
    - cron: '17 */3 * * *'

  workflow_dispatch:
    inputs:
      test_discord:
        description: 'Send a basic Discord webhook test'
        type: boolean
        default: false

      test_telegram:
        description: 'Send a fictional concert to Telegram only'
        type: boolean
        default: false

      test_concert:
        description: 'Send a sample concert using monitor.py'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: concert-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 12

    steps:
      - name: Reject conflicting test selections
        if: ${{ (inputs.test_discord == true && inputs.test_concert == true) || (inputs.test_discord == true && inputs.test_telegram == true) || (inputs.test_concert == true && inputs.test_telegram == true) }}
        run: |
          echo "ERROR: Select only one test option."
          exit 1

      - name: Check out repository
        uses: actions/checkout@v5
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install Python dependencies
        if: ${{ inputs.test_discord != true }}
        run: pip install -r requirements.txt curl_cffi

      - name: Install Playwright browser
        if: ${{ inputs.test_discord != true && inputs.test_concert != true && inputs.test_telegram != true }}
        run: python -m playwright install --with-deps chromium

      - name: Install virtual display for headed Chrome
        if: ${{ inputs.test_discord != true && inputs.test_concert != true && inputs.test_telegram != true }}
        run: sudo apt-get install -y --no-install-recommends xvfb

      - name: Send basic Discord test notification
        if: ${{ inputs.test_discord == true && inputs.test_concert != true && inputs.test_telegram != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          import urllib.error

          url = os.environ["DISCORD_WEBHOOK_URL"]

          payload = {
              "content": (
                  "🎧 Boris Brejcha Concert Monitor\n"
                  "✅ Discord webhook test successful!"
              )
          }

          request = urllib.request.Request(
              url,
              data=json.dumps(payload).encode("utf-8"),
              headers={
                  "Content-Type": "application/json",
                  "User-Agent": "BorisBrejchaConcertMonitor/1.0"
              },
              method="POST"
          )

          try:
              with urllib.request.urlopen(request, timeout=20) as response:
                  print("Discord HTTP status:", response.status)
          except urllib.error.HTTPError as error:
              print("Discord HTTP status:", error.code)
              print(
                  "Response:",
                  error.read().decode(
                      "utf-8", errors="replace"
                  )[:500]
              )
              raise
          PY

      - name: Send sample concert notification
        if: ${{ inputs.test_concert == true && inputs.test_discord != true && inputs.test_telegram != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          python - <<'PY'
          import os
          from monitor import send_discord

          webhook = os.environ["DISCORD_WEBHOOK_URL"]

          sample_event = {
              "date": "2099-05-15",
              "title": (
                  "[TEST ONLY] Boris Brejcha - "
                  "Sample Concert (not a real event)"
              ),
              "location": (
                  "Example Arena, Berlin, Germany "
                  "(fictional)"
              ),
              "url": "https://www.borisbrejcha.de/dates"
          }

          print("Sending fictional concert notification...")

          send_discord(sample_event, webhook)

          print("Sample concert notification sent successfully!")
          print("Saved concert data was not modified.")
          PY

      - name: Send sample Telegram notification
        if: ${{ inputs.test_telegram == true && inputs.test_discord != true && inputs.test_concert != true }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          from monitor import send_telegram

          sample_event = {
              "date": "2099-05-15",
              "title": (
                  "[TEST ONLY] Boris Brejcha - "
                  "Sample Concert (not a real event)"
              ),
              "location": (
                  "Example Arena, Berlin, Germany "
                  "(fictional)"
              ),
              "url": "https://www.borisbrejcha.de/dates",
          }

          print("Sending fictional Telegram concert notification...")

          send_telegram(
              sample_event,
              os.environ["TELEGRAM_BOT_TOKEN"],
              os.environ["TELEGRAM_CHAT_ID"],
          )

          print("Sample Telegram notification sent successfully!")
          print("Saved concert data was not modified.")
          PY

      - name: Check concert dates
        if: ${{ inputs.test_discord != true && inputs.test_concert != true && inputs.test_telegram != true }}
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          HEADED_CHROME: '1'   # ticket lookups use real Chrome (not headless); set to '0' to disable
        run: xvfb-run -a python monitor.py

      - name: Upload debug files
        if: ${{ always() && inputs.test_discord != true && inputs.test_concert != true && inputs.test_telegram != true }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-files
          path: |
            data/debug.html
            data/ticket_debug.json
            data/tracking_debug.json
          if-no-files-found: ignore
          retention-days: 3

      - name: Persist event state
        if: ${{ always() && inputs.test_discord != true && inputs.test_concert != true && inputs.test_telegram != true }}
        run: |
          if [ -f data/events.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

            git add data/events.json
            if [ -f data/geocode_cache.json ]; then git add data/geocode_cache.json; fi

            if ! git diff --cached --quiet; then
              git commit -m 'Update known concert events [skip ci]'
              git push
            fi
          fi
