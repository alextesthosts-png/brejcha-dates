name: Monitor concerts
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: concert-monitor
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python -m playwright install --with-deps chromium
      - name: Check concert dates
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python monitor.py
      - name: Upload HTML for troubleshooting on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: debug-html
          path: data/debug.html
          if-no-files-found: ignore
          retention-days: 3
      - name: Persist event state
        if: always()
        run: |
          if [ -f data/events.json ]; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add data/events.json
            if ! git diff --cached --quiet; then
              git commit -m 'Update known concert events [skip ci]'
              git push
            fi
          fi
