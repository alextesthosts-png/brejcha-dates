name: Deploy concert dashboard

on:
  workflow_run:
    workflows: ['Monitor concerts']
    types: [completed]
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'data/events.json'
      - '.github/workflows/deploy-dashboard.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out latest default branch
        uses: actions/checkout@v5
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Prepare public dashboard data
        env:
          # The monitor only commits real changes (plus a daily heartbeat), so take the
          # check time from the scheduled run that triggered this deploy when there is one.
          LAST_CHECK: ${{ github.event_name == 'workflow_run' && github.event.workflow_run.event == 'schedule' && github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.updated_at || '' }}
        run: |
          python - <<'PY'
          import json
          import os
          from datetime import datetime
          from pathlib import Path
          source = json.loads(Path('data/events.json').read_text(encoding='utf-8'))
          first_seen = source.get('first_seen', {})
          if not isinstance(first_seen, dict):
              first_seen = {}
          output = []
          for event in source.get('current_events', []):
              if not isinstance(event, dict):
                  continue
              location = str(event.get('location') or '')
              # Country only when source contains a clear trailing country component.
              country = location.rsplit(',', 1)[-1].strip() if ',' in location else ''
              output.append({
                  'id': event.get('id', ''),
                  'date': event.get('date', ''),
                  'title': event.get('title', ''),
                  'location': location,
                  'country': country,
                  'url': event.get('url', ''),
                  'ticket_url': event.get('ticket_url', ''),
                  'ticket_tracking_url': event.get('ticket_tracking_url', ''),
                  'ticket_provider': event.get('ticket_provider', ''),
                  'organizer': event.get('organizer', ''),
                  'first_seen': first_seen.get(event.get('id')),
              })
          last_seen = source.get('last_seen')
          try:
              check = os.environ.get('LAST_CHECK', '')
              if check and (not last_seen or datetime.fromisoformat(check) > datetime.fromisoformat(last_seen)):
                  last_seen = check
          except ValueError:
              pass
          public = {'last_seen': last_seen, 'events': output}
          Path('docs').mkdir(exist_ok=True)
          Path('docs/events.json').write_text(json.dumps(public, indent=2, ensure_ascii=False) + '\n', encoding='utf-8')
          print(f'Prepared {len(output)} public events without notification state')
          PY
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs

  # Separate job: the artifact is fully published before deploy-pages looks for it
  # (a single job intermittently failed with 'No artifacts named "github-pages" were found').
  deploy:
    needs: build
    runs-on: ubuntu-24.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
